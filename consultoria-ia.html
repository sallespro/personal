<title>Consultoria em IA para Executivos · cloudpilot</title>
<script>
  (function () {
    var theme;
    try { theme = (JSON.parse(localStorage.getItem("cloudpilot-flyer-ia:prefs")) || {}).theme; } catch (e) {}
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1b3050;
    --navy-deep: #13233c;
    --navy-ink: #24406a;
    --accent: #2e5486;
    --paper: #f1f1ef;
    --paper-2: #e9e9e6;
    --ink: #2a2f36;
    --muted: #5b6370;
    --line: #cfd3d8;
    --page-bg: #c9ccd1;
    --shadow: 0 10px 40px rgba(10, 20, 40, .25);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --navy: #16263f;
    --navy-ink: #a9c4ea;
    --accent: #3d6aa6;
    --paper: #131b27;
    --paper-2: #18212f;
    --ink: #dde3ec;
    --muted: #9ba7b8;
    --line: #2d3949;
    --page-bg: #0a0f17;
    --shadow: 0 10px 40px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page-bg);
    font-family: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  #app { padding: 72px 0 48px; }
  .flyer {
    width: 1024px;
    margin: 0 auto;
    background: var(--paper);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ---------- editing ---------- */
  .editable { white-space: pre-line; cursor: text; border-radius: 3px; transition: outline-color .15s, background-color .15s; outline: 1px dashed transparent; outline-offset: 3px; }
  .editable:hover { outline-color: rgba(120, 160, 220, .65); }
  .editable[contenteditable="true"] { outline: 2px solid #5b9cf0; background: rgba(91, 156, 240, .12); }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px;
    background: rgba(19, 35, 60, .94);
    color: #dfe6f0; font-size: 14px;
    backdrop-filter: blur(6px);
  }
  .toolbar .hint { opacity: .85; margin-right: 8px; }
  .toolbar button {
    font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 999px; padding: 7px 16px;
    border: 1px solid rgba(255,255,255,.55); background: transparent; color: #fff;
  }
  .toolbar button.primary { background: #fff; color: var(--navy-deep); border-color: #fff; }
  .toolbar button:hover { filter: brightness(1.08); }
  .toolbar .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; padding: 2px; }
  .toolbar .seg button { border: 0; padding: 5px 12px; letter-spacing: .06em; }
  .toolbar .seg button.on { background: #fff; color: var(--navy-deep); }
  .toolbar .icon-btn { padding: 6px 9px; display: inline-flex; }
  .toolbar .icon-btn .icon { color: #fff; }
  .toolbar .icon-btn svg { width: 18px; height: 18px; }
  @media (max-width: 900px) { .toolbar .hint { display: none; } }
  .toolbar button:focus-visible { outline: 2px solid #8fbaf5; outline-offset: 2px; }

  /* ---------- hero ---------- */
  .hero {
    position: relative; height: 517px; color: #fff;
    background: #1e3557;
  }
  .hero-photo {
    position: absolute; top: 0; right: 150px; width: 470px; height: 100%;
    background-size: cover; background-position: center;
  }
  .hero-photo::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, #1e3557 0%, rgba(30,53,87,.6) 14%, rgba(30,53,87,0) 34%, rgba(30,53,87,0) 80%, #1e3557 100%);
  }
  .hero-text { position: absolute; left: 60px; top: 42px; width: 400px; }
  .eyebrow { letter-spacing: .32em; font-size: 15px; font-weight: 500; text-transform: uppercase; line-height: 1.7; }
  .eyebrow.big { font-size: 21px; }
  .rule { width: 48px; height: 3px; background: #fff; margin: 22px 0 28px; }
  .hero h1 { font-size: 46px; line-height: 1.05; font-weight: 600; margin: 0 0 24px; }
  .hero .lead { font-size: 20px; line-height: 1.42; color: #eef2f7; margin: 0; }
  .hero-side {
    position: absolute; right: 44px; top: 332px; text-align: right;
    letter-spacing: .3em; font-size: 14px; line-height: 1.75; text-transform: uppercase;
  }
  .hero-side .rule-sm { width: 34px; height: 1px; background: rgba(255,255,255,.8); margin: 14px 0 14px auto; }

  /* ---------- consulting + topics ---------- */
  .middle { display: grid; grid-template-columns: 392px 1fr; padding: 40px 48px 36px 60px; background: var(--paper); }
  .about { padding-right: 28px; border-right: 1px solid var(--line); }
  .h2 { color: var(--navy-ink); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.3; margin: 0 0 22px; }
  .about p { font-size: 17px; line-height: 1.6; margin: 0; }
  .topics { padding-left: 30px; }
  .topics .h2 { margin-bottom: 4px; }
  .topics .sub { font-size: 17px; margin: 0 0 22px; }
  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; row-gap: 26px; }
  .topic { display: grid; grid-template-columns: 40px 1fr; gap: 20px; align-items: start; }
  .topic:nth-child(odd) { padding-right: 22px; border-right: 1px solid var(--line); }
  .topic:nth-child(even) { padding-left: 26px; }
  .icon { color: var(--navy-ink); display: inline-flex; }
  .icon svg { width: 38px; height: 38px; }
  .topic h3 { margin: 0 0 3px; font-size: 16px; font-weight: 600; color: var(--navy-ink); }
  .topic p { margin: 0; font-size: 15px; line-height: 1.4; color: var(--muted); }

  /* ---------- how it works ---------- */
  .how { display: grid; grid-template-columns: 450px 1fr; background: var(--paper-2); }
  .how-photo { position: relative; min-height: 313px; background-size: cover; background-position: center bottom; }
  .how-photo::before {
    content: ""; position: absolute; left: 0; top: 0; width: 292px; height: 196px;
    background: rgba(19,35,60,.74);
  }
  .how-caption { position: absolute; left: 54px; top: 50px; color: #fff; letter-spacing: .26em; font-size: 13px; line-height: 1.6; text-transform: uppercase; }
  .how-caption .icon { color: #fff; margin-bottom: 14px; }
  .how-caption .icon svg { width: 28px; height: 28px; }
  .how-steps { padding: 22px 40px 20px 36px; }
  .how-steps .h2 { font-size: 18px; margin-bottom: 14px; }
  .step { display: grid; grid-template-columns: 30px 1fr; gap: 18px; margin-bottom: 16px; }
  .step:last-child { margin-bottom: 0; }
  .num { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 600; margin-top: 2px; }
  .step h3 { margin: 0 0 2px; font-size: 16px; font-weight: 600; color: var(--navy-ink); }
  .step p { margin: 0; font-size: 14.5px; line-height: 1.4; color: var(--muted); }

  /* ---------- footer ---------- */
  .footer { background: var(--navy); color: #e7ecf3; padding: 26px 48px 28px 60px; }
  .features { display: grid; grid-template-columns: 1fr 1fr 1fr 290px; align-items: center; }
  .feature { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; padding-right: 18px; margin-right: 18px; border-right: 1px solid rgba(255,255,255,.28); }
  .feature .icon { color: #fff; }
  .feature .icon svg { width: 30px; height: 30px; }
  .feature .t { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; line-height: 1.55; color: #fff; }
  .feature .d { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.55; color: #c7d1df; margin-top: 6px; }
  .cta { text-align: center; padding-left: 10px; }
  .cta-btn {
    display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none;
    border: 1.5px solid #fff; border-radius: 999px; padding: 9px 22px; letter-spacing: .12em; font-weight: 600; font-size: 13.5px; text-transform: uppercase;
  }
  .cta-btn .icon { color: #fff; }
  .cta-btn .icon svg { width: 20px; height: 20px; }
  .cta p { margin: 10px 0 0; font-size: 15px; line-height: 1.4; }

  .contacts {
    display: flex; justify-content: center; align-items: center; gap: 30px; flex-wrap: wrap;
    margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.18);
    font-size: 14.5px;
  }
  .contact { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
  .contact .icon { color: #9fb6d6; }
  .contact .icon svg { width: 17px; height: 17px; }
  .brand { font-weight: 700; letter-spacing: .02em; font-size: 17px; color: #fff; }

  .tagline { display: flex; align-items: center; gap: 18px; justify-content: center; margin-top: 18px; }
  .tagline .ln { width: 116px; height: 1px; background: rgba(255,255,255,.4); }
  .tagline .editable { letter-spacing: .32em; font-size: 14px; text-transform: uppercase; }

  /* ---------- small screens: scale the fixed-width flyer down ---------- */
  @media screen and (max-width: 1040px) {
    #app { padding: 110px 0 24px; }
    .flyer { zoom: calc(100vw / 1060px); }
  }

  /* ---------- print / PDF ---------- */
  @media print {
    html, body { background: var(--navy); }
    #app { padding: 0; }
    .toolbar { display: none !important; }
    .flyer { box-shadow: none; margin: 0; zoom: 1 !important; }
    .editable, .editable:hover { outline: none !important; background: none !important; }
  }
</style>
<style id="page-size">@page { size: 1024px 1500px; margin: 0; }</style>

/* ---------- interface strings (not editable) ---------- */
const UI = {
  pt: {
    htmlLang: "pt-BR",
    title: "Consultoria em IA para Executivos · cloudpilot",
    hint: "Duplo clique em qualquer texto para editar · Enter salva · Esc cancela · Shift+Enter quebra linha",
    editTitle: "Duplo clique para editar",
    reset: "Restaurar textos",
    resetConfirm: "Restaurar todos os textos originais deste idioma?",
    pdf: "Converter em PDF",
    langLabel: "Idioma",
    toLight: "Tema claro",
    toDark: "Tema escuro",
    mailSubject: "Consultoria em IA",
    heroAlt: "Consultor conversando com um executivo",
    cafeAlt: "Café e notebook sobre a mesa",
  },
  en: {
    htmlLang: "en",
    title: "AI Consulting for Executives · cloudpilot",
    hint: "Double-click any text to edit · Enter saves · Esc cancels · Shift+Enter adds a line break",
    editTitle: "Double-click to edit",
    reset: "Reset text",
    resetConfirm: "Restore all original text for this language?",
    pdf: "Save as PDF",
    langLabel: "Language",
    toLight: "Light theme",
    toDark: "Dark theme",
    mailSubject: "AI Consulting",
    heroAlt: "Consultant talking with an executive",
    cafeAlt: "Coffee and laptop on a table",
  },
};
const LANGS = ["pt", "en"];

/* ---------- state ---------- */
const saved = loadSaved();
const texts = {
  pt: { ...DEFAULT_TEXT.pt, ...saved.pt },
  en: { ...DEFAULT_TEXT.en, ...saved.en },
};
const prefs = readJSON(PREFS_KEY) || {};
let lang = pickLang();
let text = texts[lang];
const rev = {}; // per-field revision: bumping it changes the vnode key, so webjsx rebuilds a node the user edited in the DOM

function readJSON(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable: state lives in memory */ }
}
function loadSaved() {
  const current = readJSON(STORAGE_KEY);
  if (current) return { pt: current.pt || {}, en: current.en || {} };
  return { pt: readJSON(LEGACY_KEY) || {}, en: {} };
}
function pickLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(fromUrl)) return fromUrl;
  if (LANGS.includes(prefs.lang)) return prefs.lang;
  return (navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en";
}
function persist() {
  const changed = { pt: {}, en: {} };
  for (const l of LANGS)
    for (const k of Object.keys(DEFAULT_TEXT[l]))
      if (texts[l][k] !== DEFAULT_TEXT[l][k]) changed[l][k] = texts[l][k];
  writeJSON(STORAGE_KEY, changed);
}

/* ---------- language + theme ---------- */
function setLang(next) {
  if (next === lang) return;
  lang = next;
  text = texts[lang];
  prefs.lang = lang;
  writeJSON(PREFS_KEY, prefs);
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
  render();
}
const currentTheme = () => document.documentElement.dataset.theme === "dark" ? "dark" : "light";
function toggleTheme() {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  prefs.theme = next;
  writeJSON(PREFS_KEY, prefs);
  render();
}

/* ---------- inline editing (double click) ---------- */
function startEdit(e) {
  const el = e.currentTarget;
  if (el.isContentEditable) return;
  e.preventDefault();
  el.contentEditable = "true";
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
function commitEdit(el, cancelled = false) {
  if (!el.isContentEditable) return;
  const id = el.dataset.edit;
  const value = el.innerText.replace(/ /g, " ").replace(/\n{3,}/g, "\n\n").trim();
  el.contentEditable = "false";
  if (!cancelled && value) text[id] = value;
  rev[id] = (rev[id] || 0) + 1;
  persist();
  render();
}
function endEdit(e) { commitEdit(e.currentTarget); }
function keyEdit(e) {
  const el = e.currentTarget;
  if (!el.isContentEditable) return;
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitEdit(el); }
  else if (e.key === "Escape") { e.preventDefault(); commitEdit(el, true); }
}
// clicking anywhere outside the field being edited saves it
document.addEventListener("mousedown", (e) => {
  const editing = document.querySelector(".editable[contenteditable='true']");
  if (editing && !editing.contains(e.target)) commitEdit(editing);
}, true);
function pastePlain(e) {
  if (!e.currentTarget.isContentEditable) return;
  e.preventDefault();
  document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
}
function guardLink(e) {
  // a single click on a link navigates; a double click (to edit its label) must not
  if (e.detail > 1 || e.currentTarget.querySelector("[contenteditable='true']")) { e.preventDefault(); return; }
  e.preventDefault();
  const href = e.currentTarget.href, target = e.currentTarget.target;
  clearTimeout(guardLink.t);
  guardLink.t = setTimeout(() => target === "_blank" ? window.open(href, "_blank", "noopener") : (location.href = href), 280);
}
document.addEventListener("dblclick", () => clearTimeout(guardLink.t), true);

// Editable text element: <tag> whose content is text[id]
function E(tag, id, props = {}) {
  return h(tag, {
    ...props,
    key: `${lang}:${id}:${rev[id] || 0}`,
    class: `${props.class || ""} editable`.trim(),
    "data-edit": id,
    title: UI[lang].editTitle,
    ondblclick: startEdit,
    onblur: endEdit,
    onkeydown: keyEdit,
    onpaste: pastePlain,
  }, text[id]);
}

/* ---------- icons ---------- */
const svg = (body) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const ICONS = {

  code: svg('<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/><path d="m14.5 4-5 16"/>'),

  user: svg('<circle cx="12" cy="8" r="4.5"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1Z"/>'),
  pin: svg('<path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>'),

  target: svg('<circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.5"/><path d="m14 10 7-7"/><path d="M17.5 3H21v3.5"/>'),
  chat: svg('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>'),
  mail: svg('<rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6 9 7 9-7"/>'),
  globe: svg('<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5a14.5 14.5 0 0 1 0 19 14.5 14.5 0 0 1 0-19"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: svg('<path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/>'),
};
const Icon = (name) => h("span", { class: "icon", "aria-hidden": "true", dangerouslySetInnerHTML: { __html: ICONS[name] } });

/* ---------- toolbar ---------- */
function exportPdf() {
  fitPageToFlyer();
  window.print(); // native print dialog → "Save as PDF"
}
function resetText() {
  if (!confirm(UI[lang].resetConfirm)) return;
  for (const k of Object.keys(DEFAULT_TEXT[lang])) { text[k] = DEFAULT_TEXT[lang][k]; rev[k] = (rev[k] || 0) + 1; }
  persist();
  render();
}
const Toolbar = () => {
  const ui = UI[lang];
  const dark = currentTheme() === "dark";
  const themeLabel = dark ? ui.toLight : ui.toDark;
  return h("div", { class: "toolbar" },
    h("span", { class: "hint" }, ui.hint),
    h("div", { class: "seg", role: "group", "aria-label": ui.langLabel },
      LANGS.map((l) => h("button", {
        type: "button",
        lang: UI[l].htmlLang,
        class: l === lang ? "on" : "",
        "aria-pressed": String(l === lang),
        onclick: () => setLang(l),
      }, l.toUpperCase())),
    ),
    h("button", { type: "button", class: "icon-btn", "aria-label": themeLabel, title: themeLabel, onclick: toggleTheme },
      Icon(dark ? "sun" : "moon")),
    h("button", { type: "button", onclick: resetText }, ui.reset),
    h("button", { type: "button", class: "primary", onclick: exportPdf }, ui.pdf),
  );
};

/* ---------- PDF page = flyer size (single page, no margins) ---------- */
function fitPageToFlyer() {
  const flyer = document.querySelector(".flyer");
  if (!flyer) return;
  document.getElementById("page-size").textContent = `@page { size: 1024px ${Math.ceil(flyer.scrollHeight)}px; margin: 0; }`;
}
window.addEventListener("beforeprint", fitPageToFlyer);

/* ---------- render ---------- */
const root = document.getElementById("app");
function render() {
  document.documentElement.lang = UI[lang].htmlLang;
  document.title = UI[lang].title;
  applyDiff(root, [
    Toolbar(),
    h("main", { class: "flyer" }, Hero(), Middle(), How(), Footer()),
  ]);
}
render();
document.fonts?.ready.then(fitPageToFlyer);
</script>
