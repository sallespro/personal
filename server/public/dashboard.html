<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversations · dashboard</title>
<style>
  :root { --bg:#f1f1ef; --card:#fff; --ink:#2a2f36; --muted:#5b6370; --line:#cfd3d8; --navy:#1b3050; --accent:#2e5486; --live:#1f9d55; --warn:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1722; --card:#17212f; --ink:#e6e9ee; --muted:#9aa5b5; --line:#2a3647; --navy:#0b1220; --accent:#6ea0e0; } }
  * { box-sizing: border-box }
  body { margin:0; font:15px/1.4 "Source Sans 3", system-ui, sans-serif; background:var(--bg); color:var(--ink) }
  header { background:var(--navy); color:#fff; padding:14px 24px; display:flex; gap:24px; align-items:center; flex-wrap:wrap }
  header h1 { font-size:18px; margin:0; font-weight:600 }
  .totals { display:flex; gap:20px; margin-left:auto; flex-wrap:wrap }
  .totals div { text-align:right } .totals b { display:block; font-size:18px } .totals span { font-size:12px; opacity:.7 }
  main { display:grid; grid-template-columns: minmax(320px, 1.2fr) minmax(280px, 1fr); gap:16px; padding:16px 24px }
  @media (max-width: 900px) { main { grid-template-columns: 1fr } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden }
  section h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:1px solid var(--line) }
  .row { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer }
  .row:hover, .row.sel { background:color-mix(in srgb, var(--accent) 10%, transparent) }
  .row .top { display:flex; gap:8px; align-items:center }
  .id { font-family:ui-monospace,monospace; font-size:12px; color:var(--muted) }
  .badge { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted) }
  .badge.live { color:#fff; background:var(--live); border-color:var(--live) }
  .badge.thinking { color:#fff; background:var(--warn); border-color:var(--warn) }
  .chip { font-size:11px; padding:1px 8px; border-radius:6px; background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent); margin-right:4px }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:14px; flex-wrap:wrap }
  .last { margin-top:4px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .note { padding:8px 14px; border-bottom:1px solid var(--line); animation:in .4s }
  .note b { color:var(--accent) } .note small { color:var(--muted); display:block }
  @keyframes in { from { background:color-mix(in srgb, var(--warn) 30%, transparent) } to { background:transparent } }
  .empty { padding:18px 14px; color:var(--muted) }
  .msg { padding:6px 14px } .msg.user { background:color-mix(in srgb, var(--accent) 8%, transparent) }
  .msg small { color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:.06em }
  #feed, #detail { max-height:46vh; overflow:auto }
</style>
</head>
<body>
<header>
  <h1>Conversations</h1>
  <span id="conn" class="badge" data-testid="conn">connecting…</span>
  <div class="totals">
    <div><b data-testid="t-live">0</b><span>live now</span></div>
    <div><b data-testid="t-convs">0</b><span>conversations</span></div>
    <div><b data-testid="t-tokens">0</b><span>tokens</span></div>
    <div><b data-testid="t-cost">$0.0000</b><span>est. cost</span></div>
  </div>
</header>
<main>
  <div>
    <section>
      <h2>Conversations</h2>
      <div id="list" data-testid="conv-list"><div class="empty">No conversations yet.</div></div>
    </section>
  </div>
  <div style="display:grid; gap:16px; align-content:start">
    <section>
      <h2>Notifications</h2>
      <div id="feed" data-testid="feed"><div class="empty">Customer intent headlines appear here.</div></div>
    </section>
    <section>
      <h2 id="detail-title">Transcript</h2>
      <div id="detail" data-testid="detail"><div class="empty">Select a conversation.</div></div>
    </section>
  </div>
</main>
<script>
const token = new URLSearchParams(location.search).get('token');
const q = token ? `?token=${encodeURIComponent(token)}` : '';
const convs = new Map(); let selected = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const usd = (n) => '$' + n.toFixed(4);
const ago = (t) => { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago'; };

function renderTotals() {
  const all = [...convs.values()];
  $('[data-testid=t-live]').textContent = all.filter((c) => c.live).length;
  $('[data-testid=t-convs]').textContent = all.length;
  $('[data-testid=t-tokens]').textContent = all.reduce((s, c) => s + c.usage.totalTokens, 0);
  $('[data-testid=t-cost]').textContent = usd(all.reduce((s, c) => s + c.usage.costUsd, 0));
}
function renderList() {
  const rows = [...convs.values()].sort((a, b) => b.lastActivity - a.lastActivity);
  $('#list').innerHTML = rows.length ? rows.map((c) => `
    <div class="row ${c.id === selected ? 'sel' : ''}" data-id="${c.id}" data-testid="conv-row">
      <div class="top"><span class="id">${c.id}</span>
        <span class="badge ${c.status === 'thinking' ? 'thinking' : c.live ? 'live' : ''}" data-testid="status">${c.status === 'thinking' ? 'thinking' : c.live ? 'live' : 'idle'}</span>
        <span class="badge">${c.lang}</span><span class="meta" style="margin:0 0 0 auto">${ago(c.lastActivity)}</span></div>
      <div class="last">${c.lastUserMessage ? esc(c.lastUserMessage) : '<i>no messages yet</i>'}</div>
      <div class="meta"><span>${c.topics.map((t) => `<span class="chip">${esc(t)}</span>`).join('') || '—'}</span>
        <span data-testid="tokens">${c.usage.inputTokens} in / ${c.usage.outputTokens} out tokens</span>
        <span data-testid="cost">${usd(c.usage.costUsd)}</span><span>${c.messageCount} msgs</span></div>
    </div>`).join('') : '<div class="empty">No conversations yet.</div>';
  renderTotals();
}
function pushNote(n, convId) {
  const feed = $('#feed'); if (feed.querySelector('.empty')) feed.innerHTML = '';
  const el = document.createElement('div'); el.className = 'note'; el.dataset.testid = 'note'; el.setAttribute('data-testid', 'note'); el.dataset.topic = n.topic;
  el.innerHTML = `<b>${esc(n.headline)}</b><small>${convId} · “${esc(n.excerpt)}”</small>`;
  feed.prepend(el);
}
async function showDetail(id) {
  selected = id; renderList();
  const r = await fetch(`/api/conversations/${id}${q}`); const c = await r.json();
  $('#detail-title').textContent = `Transcript · ${id}`;
  $('#detail').innerHTML = c.messages.map((m) => `<div class="msg ${m.role}"><small>${m.role}${m.via === 'voice' ? ' · voice' : ''}</small><div>${esc(m.content)}</div></div>`).join('') || '<div class="empty">Empty.</div>';
}
$('#list').addEventListener('click', (e) => { const row = e.target.closest('.row'); if (row) showDetail(row.dataset.id); });

async function boot() {
  const r = await fetch('/api/conversations' + q);
  if (r.status === 401) { $('#conn').textContent = 'unauthorized (add ?token=)'; return; }
  const data = await r.json(); data.conversations.forEach((c) => convs.set(c.id, c)); renderList();
  [...data.notifications].reverse().forEach((n) => pushNote(n, n.conversationId));
  const es = new EventSource('/api/events' + q);
  es.onopen = () => { $('#conn').textContent = 'connected'; $('#conn').classList.add('live'); };
  es.onerror = () => { $('#conn').textContent = 'reconnecting…'; $('#conn').classList.remove('live'); };
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.conversation) { convs.set(ev.conversation.id, ev.conversation); renderList(); }
    if (ev.type === 'notification') pushNote(ev.notification, ev.conversationId);
    if (ev.type === 'message' && ev.conversationId === selected) showDetail(selected);
  };
}
boot();
setInterval(() => { // refresh "live" decay + relative times
  fetch('/api/conversations' + q).then((r) => r.json()).then((d) => { d.conversations.forEach((c) => convs.set(c.id, c)); renderList(); }).catch(() => {});
}, 10000);
</script>
</body>
</html>
